[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "videcide"
version = "1.0.0"
description = "ViDecide: Teaching Video Diffusion Models to Reason and Plan Step by Step"
readme = "README.md"
license = { text = "S-Lab License 1.0" }
requires-python = ">=3.10"
authors = [{ name = "The ViDecide Authors" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
