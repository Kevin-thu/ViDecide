# DiT-B (132M, 256 x 256 pixels, one frame per move) trained from scratch on FlowFree, frame-wise causal (K=1),
# training shift s=10: logit-normal timesteps with mean log(10). 10,000 updates at batch 32 with 500 warmup updates
# (mode train), then 1,000 updates of linear decay to zero (mode anneal, --resume <train>/step_010000/full_state.pt).
# Data: the pixel cache of scripts/dit/build_cache.py --task flowfree in data/dit/flowfree.
# Other arms of Tabs. 1, 4 and S7: --arm k8 / bidir / df, --mu 0 (s=1) or --mu 1.609438 (s=5).
task: flowfree
arm: k1
mu: 2.302585092994046
batch: 32
accum: 16          # gradient accumulation micro-steps per update (memory only)
lr: 1.0e-4
warmup: 500
ema: 0.999
steps: 10000
anneal_steps: 1000
seed: 20261007
sample_steps: 5    # evaluation: five Euler steps per frame on a uniform noise grid, EMA weights
sample_shift: 1.0
