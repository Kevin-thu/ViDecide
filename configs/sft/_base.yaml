# Shared settings for supervised fine-tuning of Wan2.2-TI2V-5B (Sec. 4.1 and Tab. S3 of the paper).
# Every experiment config in this folder starts from this file (`_base_`), and the result is merged over
# Causal-Forcing's configs/default_config.yaml by scripts/sft/train_sft.py.
# Paths are relative to the repository root.

model_kwargs:
  model_name: checkpoints/Wan2.2-TI2V-5B   # needs checkpoints/Wan2.2-TI2V-5B-Diffusers/vae next to it
  timestep_shift: 10.0                     # training shift s of the decision-focused schedule (Eq. 4); s=5 is Wan2.2's default
timestep_shift: 5.0                        # sampling shift; all models sample with a shift of 5
val_timestep_shift: 5.0                    # common shift for the validation loss, so that runs with different s compare
guidance_scale: 1.0                        # inference only: the paper samples without classifier-free guidance
negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，形态畸形，杂乱的背景"  # Wan2.2 default, only used with CFG

# Causal generation with teacher forcing (a clean and a noisy copy of every video); latent frame 0 is o_0.
trainer: diffusion
causal: true
teacher_forcing: true
num_frame_per_block: 1                     # segment length K in latent frames (1 latent = 4 video frames)
independent_first_frame: true
i2v: true
paired_training_noise: true
variable_length: true                      # native duration; metadata-backed validity masks
load_raw_video: false
denoising_loss_type: flow
num_train_timestep: 1000
warp_denoising_step: true
ts_schedule: false
uniform_train_timestep: false
training_timestep_min_index: 0
training_timestep_max_index: 1000
same_step_across_blocks: true
last_step_only: false
context_noise: 0
distribution_loss: dmd                     # unused by the diffusion trainer, kept for Causal-Forcing compatibility

# Latent frames are bucketed by length; 81 latent frames = 321 video frames.
frame_buckets: [9, 17, 25, 33, 41, 49, 57, 65, 73, 81]
prebuild_buckets: [9, 17, 25, 33, 41, 49, 57, 65, 73, 81]
image_or_video_shape: [1, 81, 48, 24, 24]

# Optimisation (AdamW, cosine schedule, bf16, gradient clipping at 1.0).
lr: 1.0e-5
lr_schedule: cosine
warmup_steps: 500
beta1: 0.9
beta2: 0.999
weight_decay: 0.01
max_grad_norm: 1.0
mixed_precision: true
ema_weight: 0.0
ema_start_step: 2000000000
seed: 20260819
batch_size: 1                              # videos per GPU and step
gradient_accumulation_steps: 1
gradient_checkpointing: true
gc_interval: 100

# FSDP (full sharding over the GPUs of the run).
sharding_strategy: full
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
text_encoder_fsdp_wrap_strategy: size
tp_size: 1
sp_size: 1
dp_size: null

# Data loading and exact resume (per-rank data cursor and RNG are saved with every full training state).
num_workers: 0
restore_rank_state: true
data_step_origin: 0

# Validation loss on held-out training-distribution videos.
val_samples: 256
val_interval: 1000

# Checkpoints: a rolling full training state (for resuming) and the final full state.
save_iters: 1000
save_model_only: true
save_full_state_final: true
rolling_full_state_iters: 1000
named_checkpoint_steps: []                 # add steps here to keep weights-only milestones

# Logging (pass --disable-wandb to the trainer to turn W&B off).
wandb_host: ""
wandb_key: ""
wandb_entity: ""
wandb_project: videcide
wandb_name: sft
